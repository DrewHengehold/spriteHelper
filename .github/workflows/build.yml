name: Build macOS app

on:
  push:
    branches: [main, henrik]
  workflow_dispatch:
    inputs:
      avatar:
        description: "Avatar folder in web/src/avatars (blank = web/avatar.config.js)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # macos-15 images ship Xcode 26 (macOS 26 SDK), and their runner pools are far less busy than
    # macos-26's. arm64 builds natively on Apple Silicon (all features); amd64 builds natively on an
    # Intel runner (Apple Speech only, no Parakeet/diarization). ARCH=amd64 ./build.sh also
    # cross-compiles on Apple Silicon if you'd rather use one runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xc" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Using $xc"
          sudo xcode-select -s "$xc/Contents/Developer"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Web install + tests
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Build HockeyTime.app for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          AVATAR: ${{ github.event.inputs.avatar }}
        run: ./build.sh

      - name: Verify architecture
        run: |
          want=${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
          archs=$(lipo -archs build/HockeyTime.app/Contents/MacOS/HockeyTime)
          echo "HockeyTime binary architectures: $archs (want $want)"
          [[ "$archs" == *"$want"* ]]
          codesign --verify --deep --strict build/HockeyTime.app

      - name: Zip
        run: ditto -c -k --keepParent build/HockeyTime.app HockeyTime-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HockeyTime-${{ matrix.arch }}
          path: HockeyTime-${{ matrix.arch }}.zip
          retention-days: 30
