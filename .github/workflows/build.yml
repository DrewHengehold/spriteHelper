name: Build macOS app

on:
  push:
    branches: [main, henrik]
  workflow_dispatch:
    inputs:
      avatar:
        description: "Avatar folder in web/src/avatars (blank = web/avatar.config.js)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Apple Silicon runner with the macOS 26 SDK. arm64 builds natively (all features);
    # amd64 cross-compiles to x86_64 (Apple Speech only, no Parakeet/diarization).
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Web install + tests
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Build HockeyTime.app for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          AVATAR: ${{ github.event.inputs.avatar }}
        run: ./build.sh

      - name: Verify architecture
        run: |
          want=${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
          archs=$(lipo -archs build/HockeyTime.app/Contents/MacOS/HockeyTime)
          echo "HockeyTime binary architectures: $archs (want $want)"
          [[ "$archs" == *"$want"* ]]
          codesign --verify --deep --strict build/HockeyTime.app

      - name: Zip
        run: ditto -c -k --keepParent build/HockeyTime.app HockeyTime-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HockeyTime-${{ matrix.arch }}
          path: HockeyTime-${{ matrix.arch }}.zip
          retention-days: 30
