name: Build HockeyTime (macOS + Windows)

on:
  push:
    branches: [main, henrik]
  workflow_dispatch:
    inputs:
      avatar:
        description: "Avatar folder in web/src/avatars (blank = web/avatar.config.js)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Both build on Intel macos-15 runners (Xcode 26, macOS 26 SDK), which reliably start; Apple Silicon
    # runners often can't be acquired. amd64 builds natively (Apple Speech only, no Parakeet/diarization);
    # arm64 cross-compiles via ARCH=arm64 and keeps every feature.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15-intel   # cross-compiles to arm64; GitHub's Apple Silicon runners are often unavailable
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xc" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "Using $xc"
          sudo xcode-select -s "$xc/Contents/Developer"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Web install + tests
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Build HockeyTime.app for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          AVATAR: ${{ github.event.inputs.avatar }}
        run: ./build.sh

      - name: Verify architecture
        run: |
          want=${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
          archs=$(lipo -archs build/HockeyTime.app/Contents/MacOS/HockeyTime)
          echo "HockeyTime binary architectures: $archs (want $want)"
          [[ "$archs" == *"$want"* ]]
          codesign --verify --deep --strict build/HockeyTime.app

      - name: Zip
        run: ditto -c -k --keepParent build/HockeyTime.app HockeyTime-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HockeyTime-${{ matrix.arch }}
          path: HockeyTime-${{ matrix.arch }}.zip
          retention-days: 30

  windows:
    name: Build (windows x64)
    # HockeyTime for Windows: Henrik as a desktop pet (Electron). Same Henrik page, glide, tricks and goal
    # show; dictation and notes are Mac-only for now.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            windows/package-lock.json

      - name: Build the Henrik page
        working-directory: web
        env:
          AVATAR: ${{ github.event.inputs.avatar }}
        run: |
          npm ci
          npm run build

      - name: Install, check
        working-directory: windows
        run: |
          npm ci
          npm run check

      - name: Smoke test (launch, goal show, screenshots)
        working-directory: windows
        run: npm run smoke

      - name: Package HockeyTime.exe
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # not code-signed
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: HockeyTime-windows-x64
          path: windows/dist/HockeyTime-*-x64.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-screenshots
          path: windows/smoke/
          retention-days: 7
          if-no-files-found: ignore
