<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>goal</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// The goal show's net and puck, drawn as pixel art over the whole work area. A port of the Mac app's
// GoalView (GoalShow.swift); coordinates are y-up like AppKit, so the drawing code matches it line for line.
const q = new URLSearchParams(location.search)
const dir = +q.get('dir') || 1
const net = JSON.parse(q.get('net')), from = JSON.parse(q.get('from')), to = JSON.parse(q.get('to'))
const tRelease = +q.get('tRelease'), tArrive = +q.get('tArrive'), tEnd = +q.get('tEnd')

const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
let W = 0, H = 0
function resize() {
  W = window.innerWidth; H = window.innerHeight
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio
}
resize(); window.addEventListener('resize', resize)

const px = 4
const snap = v => Math.round(v / px) * px
function block(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(snap(x), snap(y), Math.max(px, snap(w)), Math.max(px, snap(h))) }
const rgba = (r, g, b, a = 1) => `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a})`

const start = performance.now()
function frame(now) {
  const t = (now - start) / 1000
  if (t < tEnd + 0.2) requestAnimationFrame(frame)
  const netIn = Math.min(1, t / 0.4)
  const puckK = t < tRelease ? -1 : t < tArrive ? (t - tRelease) / (tArrive - tRelease) : 1
  const scored = t >= tArrive, since = t - tArrive
  const fade = t > tEnd - 0.5 ? Math.max(0, (tEnd - t) / 0.5) : 1

  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.setTransform(devicePixelRatio, 0, 0, -devicePixelRatio, 0, H * devicePixelRatio)   // y up
  ctx.globalAlpha = fade
  ctx.imageSmoothingEnabled = false

  // net drops in from above, shakes when the puck hits
  const e = netIn < 1 ? 1 - Math.pow(1 - netIn, 3) : 1
  const n = { x: net.x, y: net.y + (1 - e) * 160, w: net.w, h: net.h }
  if (scored && since < 0.5) n.x += Math.sin(since * 60) * 6 * (1 - since / 0.5)

  const ink = rgba(0.05, 0.09, 0.19), red = rgba(0.84, 0.16, 0.23), mesh = 'rgba(255,255,255,0.85)', shade = rgba(0.75, 0.82, 0.93, 0.55)
  const mouthX = dir > 0 ? n.x : n.x + n.w, backX = dir > 0 ? n.x + n.w : n.x
  const depth = n.w * 0.55

  block(n.x - 8, n.y - 6, n.w + 16, 8, 'rgba(0,0,0,0.18)')                    // shadow on the ice
  const bodyX = Math.min(mouthX, mouthX + dir * depth), bodyW = Math.abs(depth)
  block(bodyX, n.y, bodyW, n.h * 0.8, shade)                                   // the net's mesh body
  for (let gx = bodyX; gx <= bodyX + bodyW; gx += 12) block(gx, n.y, px, n.h * 0.8, mesh)
  for (let gy = n.y; gy <= n.y + n.h * 0.8; gy += 12) block(bodyX, gy, bodyW, px, mesh)
  for (let i = 0; i <= 10; i++) {                                              // sloping back frame
    const k = i / 10, topBack = mouthX + dir * depth
    block(topBack + k * (backX - topBack) - px, n.y + n.h * 0.8 * (1 - k), px * 2, px * 2, red)
  }
  block(mouthX - px * 2, n.y, px * 4, n.h, ink)                                // red posts and crossbar
  block(mouthX - px, n.y, px * 2, n.h - px, red)
  block(bodyX - px, n.y + n.h * 0.8 - px, bodyW + px * 2, px * 3, ink)
  block(bodyX, n.y + n.h * 0.8, bodyW, px, red)
  block(bodyX, n.y - px, bodyW, px * 2, red)

  const lightOn = scored && Math.floor(since * 6) % 2 === 0                     // goal light
  const lx = mouthX + dir * depth * 0.5 - 10
  block(lx - px, n.y + n.h * 0.8 + px * 3, 28, 20, ink)
  block(lx, n.y + n.h * 0.8 + px * 4, 20, 12, lightOn ? rgba(1, 0.25, 0.2) : rgba(0.35, 0.1, 0.1))
  if (lightOn) {
    block(lx - 16, n.y + n.h * 0.8 + px * 5, 8, 4, rgba(1, 0.4, 0.3, 0.7))
    block(lx + 28, n.y + n.h * 0.8 + px * 5, 8, 4, rgba(1, 0.4, 0.3, 0.7))
  }

  if (puckK >= 0) {                                                            // the puck, with a streak
    const k = Math.min(1, puckK)
    const at = kk => [from.x + (to.x - from.x) * kk, from.y + (to.y - from.y) * kk + Math.sin(kk * Math.PI) * 40]
    const [x, y] = at(k)
    if (puckK < 1) for (let i = 1; i <= 6; i++) {
      const [tx, ty] = at(Math.max(0, k - i * 0.03))
      block(tx - 4, ty - 2, 8, 4, `rgba(255,255,255,${0.5 - i * 0.07})`)
    }
    const settle = scored ? dir * Math.min(since, 0.3) * 30 : 0
    block(x - 12 + settle, y - 6, 24, 12, ink)
    block(x - 10 + settle, y - 4, 20, 8, rgba(0.15, 0.16, 0.2))
    block(x - 6 + settle, y, 8, 4, rgba(0.3, 0.32, 0.38))
  }
}
requestAnimationFrame(frame)
</script>
</body>
</html>
